<style type='text/css'>
:root {
  --color: #eceff1;
  --color2: #f3f3f3;
  --color3: #f5f5f5;
  --color4: #37474f;
  --color5: #4774a7;
  --border: #b0bec5;
}

*,*:before,*:after{margin:0;padding:0;-webkit-box-sizing:border-box;box-sizing:border-box;}
body{background:var(--color);color:var(--color4);font-size:16px;font-family:-apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji","Segoe UI Symbol";line-height:1.3em;position:relative;}
body.no-scroll{overflow:hidden;}
a,a:link,a:visited{color:var(--color5);text-decoration:none;}
a.newtab:after{content:'\02197';position:relative;top:-5px;display:inline-block;margin-left:5px;font-size:10px;line-height:1;text-align:center;width:12px;height:12px;background-color:var(--border);color:var(--color3);border-radius:2px;}
ol,ul{list-style:none;}
h1{font-size:150%;}
h2{font-size:120%;}
input[type=text],input[type=number],input[type=search],textarea,select{padding:7px 10px;background:#fbfbfb;outline:none;border-radius:2px;border:1px solid var(--border);}
input[type=number].no_arrow::-webkit-outer-spin-button,input[type=number].no_arrow::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number].no_arrow{-moz-appearance:textfield;}
.bg3 input[type=text],.bg3 input[type=number],.bg3 input[type=search],.bg3 textarea,.bg3 select{background-color:var(--color);color:var(--color4);}
input[readonly],.bg3 input[readonly]{background:rgba(176,190,197,.5);cursor:default;}
.bg3 input[readonly]{background-color:var(--border);}
textarea{overflow:auto;resize:vertical;}
select{padding-right:25px;-webkit-appearance:none;-moz-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,gray 50%),linear-gradient(135deg,gray 50%,transparent 50%);background-position:calc(100% - 13px) calc(.8em + 2px),calc(100% - 8px) calc(.8em + 2px);background-size:5px 5px,5px 5px;background-repeat:no-repeat;} /* https://codepen.io/vkjgr/pen/VYMeXp */
svg{fill:currentColor;}
hr{border-color:var(--border);}
details[open] summary{margin-bottom:15px;}

/* Flexbox */
.flex{display:-webkit-flex;display:flex;}
.flex_wrap{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;}
.f_perfect{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.7);}/* Perfect Centering: parent */
.f_perfect .fp_content{margin:auto;}/* Perfect Centering: content */
.f_column{flex-direction:column;}
.f_top{-webkit-align-items:flex-start;align-items:flex-start;-webkit-align-content:flex-start;align-content:flex-start;}
.f_middle{-webkit-align-items:center;align-items:center;-webkit-align-content:center;align-content:center;}
.f_bottom{-webkit-align-items:flex-end;align-items:flex-end;-webkit-align-content:flex-end;align-content:flex-end;}
.f_center{-webkit-justify-content:center;justify-content:center;}
.f_left{-webkit-justify-content:flex-start;justify-content:flex-start;}
.f_right{-webkit-justify-content:flex-end;justify-content:flex-end;}
.f_grow{-webkit-flex-grow:1;flex-grow:1;}
.f_grow.f_clamp{max-height:1.3em;overflow:hidden;width:min-content;margin-right:10px;}
.f_between{-webkit-justify-content:space-between;justify-content:space-between;}

.t_perfect{display:table;margin:auto;}
.t_perfect .tp_content{display:table-cell;vertical-align:middle;}
.t_center{text-align:center;}
.t_left{text-align:left;}
.t_right{text-align:right;}
.t_justify{text-align:justify;}

.table{border-collapse:collapse;}
.table tr{background:var(--color);}
.table tr:hover{background:var(--color2);}
.table tr th,.table tr td{padding:.25em .5em;border:1px solid var(--border);}
.table-editable{table-layout:fixed;}
.table-editable [contenteditable]:focus-visible{text-overflow:initial;white-space:normal;outline:3px solid rgba(0,123,255,.25);}

.form-group{margin-top:20px;}

.form-group .label {font-weight:bold;display:inline-block;}

a.btn{color:var(--color3);}

.full,.w100{width:100%;}

.layer_y{padding:15px 0;}

.block{display:block;}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;} /* if no "space", add "&#160;&#173;" or "&#12644;" */
.clamp.lc1{-webkit-line-clamp:1}
.wrap{inline-size:max-content;word-break:break-all;}
.nowrap{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.line{height:2px;border-top:1px solid #d9dde0;border-bottom:1px solid #f9fbfa;}
.new_line{height:12px;}

.highlighted{background:rgba(0,123,255,.25);}
.cs_pointer{cursor:pointer;}

.no_scroll{overflow:hidden;}
.no_select{-webkit-touch-callout:none;-webkit-user-select:none;-khtml-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}

.m_all{margin:20px;}

.mb0{margin-bottom:0;}

.loading:before,.no-image:before{content:'';position:absolute;top:0;bottom:0;right:0;left:0;text-indent:-9999px;}
.loading.lody{position:absolute;width:100%;height:100%;overflow:hidden;}
.loading.lody:before{background:var(--color2);z-index:9998;position:fixed;}
.loading.loge{position:relative;}
.loading.loge:before{background:var(--color2) no-repeat center/40% 40%;}
.loading.loge:not(img):before{background-color:rgba(176,190,197,.7);}
.loading.loge.nd:before{background-size:100% 100%;}

.no-image{font-size:80%;line-height:100%;}
.no-image:before{background-color:var(--color3);}
.no-image:after{content:'no-image';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}

.la2yloading:before{background-image:none !important;}
.la2yloading:after{content:'Loading...';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);}
.lazyload3d{opacity:0;}
.lazyload3d.lazyshow{opacity:1;transition:opacity .5s ease;}
.lazyload3d.no-image{display:inline-block;margin-bottom:2px;}

.hd-title{font-size:85%;font-weight:bold;}

[disabled],.disabled{pointer-events:none;cursor:not-allowed !important;-webkit-user-select:none;user-select:none;}
.btn[disabled],.btn[disabled]:hover,.btn.disabled,.btn.disabled:hover,input[disabled],input[disabled]:hover,input.disabled,input.disabled:hover{background:var(--border) !important;color:var(--color) !important;border-color:var(--border) !important;}

.no_items{display:none;}
.hidden_items{visibility:hidden;opacity:0;margin:0;padding:0;max-height:0;max-width:0;overflow:hidden;text-indent:-9999px;}

/* noscript */

/* Main */

/* Post Wrapper */

/* Dark Mode */

  body {
    --color: #222;
    --color2: #2a2a2a;
    --color4: #bbb;
    --color6: #333;
    --border: #444;
  }

  /* Scrollbar */
  ::-webkit-scrollbar{width:15px;}
  ::-webkit-scrollbar-track{background:#111;}
  .bg2 ::-webkit-scrollbar-track{background:#1f1f1f;}
  ::-webkit-scrollbar-thumb{background:#333;}

  input[type=text],input[type=number],input[type=search],textarea,select{background-color:#2d2d2d;color:var(--color4);}
  .bg2 input[type=text],.bg2 input[type=number],.bg2 input[type=search],.bg2 textarea,.bg2 select{background-color:var(--color);}
  .bg3 input[type=text],.bg3 input[type=number],.bg3 input[type=search],.bg3 textarea,.bg3 select{background-color:rgba(0,0,0,.5);color:var(--color3);border-color:/*rgba(0,0,0,.5)*/#233a53;}
  input[type=search]::-webkit-search-cancel-button{filter:invert(1);}

  input[readonly],.bg2 input[readonly]{background-color:var(--border);}
  .bg3 input[readonly]{background-color:rgba(255,255,255,.15);border-color:/*rgba(255,255,255,.15)*/#6289b4;}

  .bg3 .btn:not(.red):not(.green):not(.bgrey){background-color:#406896;border-color:#406896;}
  .btn:hover,.btn.selected{background-color:#395c84;}
  .btn.red:hover,.btn.red.selected{background-color:#dd584f;}
  .btn.green:hover,.btn.green.selected{background-color:#238636;}
  .btn.bgrey,.btn.bgrey:hover,.btn.bgrey.selected,.bgrey{background-color:var(--color6);color:var(--color4);border-color:var(--border);}
  .full_img{background-color:var(--color2);color:var(--color4);border-color:var(--border);}
  .line{border-top-color:#17151b;border-bottom-color:var(--color6);}
  .loading.loge:not(img):before{background-color:rgba(0,0,0,.7);}
  .no-image:before{background-color:var(--color2);}

  .btn[disabled],.btn[disabled]:hover,.btn.disabled,.btn.disabled:hover,input[disabled],input[disabled]:hover,input.disabled,input.disabled:hover{background-color:var(--color2) !important;color:var(--border)!important;border-color:var(--color2) !important;}
  .bg2 .btn[disabled],.bg2 .btn[disabled]:hover,.bg2 input[disabled],.bg2 input[disabled]:hover{background-color:var(--color) !important;border-color:var(--color) !important;}
  .bg3 .btn[disabled],.bg3 .btn[disabled]:hover,.bg3 input[disabled],.bg3 input[disabled]:hover{background-color:#395c84 !important;color:#6289b4 !important;border-color:#395c84 !important;}
}

<script type="text/javascript">
// Simple querySelector https://codepen.io/sekedus/pen/oKYOEK
function el(e,l,m) {
  var elem, parent = l != 'all' && l != 'xpath' && (l || l === null) ? l : document;
  if (parent === null) {
    elem = parent;
    console.error('selector: '+ e +' => parent: '+ parent);
  } else {
    if ((m || l) == 'xpath') {
      // https://stackoverflow.com/a/14284815
      elem = document.evaluate(e, parent, null, XPathResult.FIRST_ORDERED_NODE_TYPE, null).singleNodeValue;
    } else {
      elem = ((m || l) == 'all') ? parent.querySelectorAll(e) : parent.querySelector(e);
    }
  }
  return elem;
}

// Check if string is URL https://stackoverflow.com/a/49849482
function isValidUrl(string) {
  // regex = https://gist.github.com/dperini/729294
  var res = string.match(/^(?:(?:(?:https?|ftp):)?\/\/)?(?:\S+(?::\S*)?@)?(?:(?!(?:10|127)(?:\.\d{1,3}){3})(?!(?:169\.254|192\.168)(?:\.\d{1,3}){2})(?!172\.(?:1[6-9]|2\d|3[0-1])(?:\.\d{1,3}){2})(?:[1-9]\d?|1\d\d|2[01]\d|22[0-3])(?:\.(?:1?\d{1,2}|2[0-4]\d|25[0-5])){2}(?:\.(?:[1-9]\d?|1\d\d|2[0-4]\d|25[0-4]))|(?:(?:[a-z0-9\u00a1-\uffff][a-z0-9\u00a1-\uffff_-]{0,62})?[a-z0-9\u00a1-\uffff]\.)+(?:[a-z\u00a1-\uffff]{2,}\.?))(?::\d{2,5})?(?:[/?#]\S*)?$/i);
  return (res !== null);
}

// loadXMLDoc (XMLHttpRequest) https://codepen.io/sekedus/pen/vYGYBNP
function loadXMLDoc(url, callback, info = {}) {
  var xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function() {
    if (xhr.readyState == XMLHttpRequest.DONE) {
      var response = this.responseText;
      if (this.status == 200) {
        if (info.parse) {
          var resHTML = new DOMParser();
          response = resHTML.parseFromString(response, 'text/html');
        }
      } else {
        var err_msg = '!! ERROR: loadXMLDoc';
        if ('timeout' in info) err_msg += ` timed out (${info.timeout}).`;
        err_msg += ' status = '+ this.status +', url = '+ url;
        console.error(err_msg);
      }
      var data = {"code": this.status, "url": url, "response": response};
      if (typeof err_msg !== 'undefined') data.error = err_msg;
      callback(data);
    }
  };
  xhr.open('GET', url, true);
  xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
  xhr.send();
}

// #===========================================================================================#

function scrap_show(data) {
  el('.post-content').classList.remove('loading', 'loge');
  if ('error' in data && data.response == '') {
    el('.source-url a').href = wv_url;
    el('.source-url a').innerHTML = wv_url;
    el('.result-code .code strong').innerHTML = data.code;
    el('.result-xml textarea').value = data.error;
  } else {
    window['wv_data'] = JSON.parse(data.response);
    // console.log('wv_data:', wv_data);

    var err = 'error' in wv_data ? wv_data.error : false;
    el('.source-url a').href = !/^(https?:)?\/\//.test(wv_data.url) ? ('//'+ wv_data.url) : wv_data.url;
    el('.source-url a').innerHTML = wv_data.url;

    if (we_bypass.checked && 'bypass_url' in wv_data) {
      el('.bypass-url a').href = wv_data.bypass_url;
      el('.bypass-url a').innerHTML = wv_data.bypass_url;
      el('.bypass-url').classList.remove('no_items');
    }

    el('.result-code .code strong').innerHTML = wv_data.status_code;
    el('.result-code .bypass').innerHTML = !err && wv_data.bypass ? ' (bypass)' : '';
    el('.result-code .method').innerHTML = we_post.checked ? ' [POST]' : ' [GET]';
    if (wv_data.status_code == 200) el('.result-code .result-bottom').classList.add('result-ok');
    el('.result-xml textarea').value = err ? ('❗❗ Error:\n\n'+ err.message +' in '+ err.file +' on line '+ err.line) : wv_data.body;
  }

  el('.scrap-result').classList.remove('no_items');
  el('.result-xml textarea').scrollTop = 0;
}

function scrap_submit() {
  wv_url = el('.scrap-url').value;
  if (wv_url == '') {
    el('.scrap-url').focus();
    return;
  }
  if (!/^(https?|ftp):/.test(wv_url)) wv_url = 'http://'+ wv_url.replace(/^\/\//, '');

  if (!isValidUrl(wv_url)) {
    alert('Invalid URL');
    el('.scrap-url').select();
    return;
  }

  el('.post-content').classList.add('loading', 'loge');
  el('.scrap-result').classList.add('no_items');
  el('.bypass-url').classList.add('no_items');
  el('.result-code .result-bottom').classList.remove('result-ok');

  var url = './test.php?url='+ encodeURIComponent(wv_url);
  url += '&curl='+ we_curl.checked;
  url += '&bypass='+ we_bypass.checked;
  url += '&mobile='+ el('.scrap-submit .mobile input').checked;
  url += '&post='+ we_post.checked;
  url += '&headers='+ encodeURIComponent(JSON.stringify(headers_set()));
  // url += '&body='+ encodeURIComponent(el('#body').value);

  loadXMLDoc(url, scrap_show);
}

function headers_set() {
  var headers = {};
  var rows = el('tbody', we_headers).rows;
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    if (el('input[type="checkbox"]', r).checked) {
      var key = el('.key', r).textContent.trim();
      var value = el('.value', r).textContent.trim();
      if (key !== '' && value !== '') {
        headers[key] = value;
      }
    }
  }
  return headers;
}

function headers_build() {
  var hd_str = '<tr>';
  hd_str += '<td class="t_center"><input type="checkbox"/></td>';
  hd_str += '<td class="key nowrap" placeholder="key" contenteditable="plaintext-only"></td>';
  hd_str += '<td class="value nowrap" placeholder="value" contenteditable="plaintext-only"></td>';
  hd_str += '<td><button class="delete btn red">X</button></td>';
  hd_str += '</tr>';

  var hd_tr = document.createElement('tr');
  hd_tr.innerHTML = hd_str;
  return hd_tr;
}

// #===========================================================================================#

var wv_data, wv_url;
var we_headers = el('.req-headers');
var we_curl = el('.scrap-submit .curl input');
var we_bypass = el('.scrap-submit .bypass input');
var we_post = el('.scrap-submit .post input');

var hd_body = el('tbody', we_headers);
var hd_all = el('.select-all', we_headers);

el('thead .add', we_headers).addEventListener('click', function() {
  var newRow = headers_build();
  hd_body.appendChild(newRow);
});

hd_all.addEventListener('change', function() {
  var cl = el('tbody input[type="checkbox"]', hd_body, 'all');
  cl.forEach(function(cb) {
    cb.checked = hd_all.checked;
    cb.closest('tr').classList[cb.checked ? 'remove' : 'add']('disabled-row');
  });
});

hd_body.addEventListener('change', function(e) {
  if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') {
    e.target.closest('tr').classList[e.target.checked ? 'remove' : 'add']('disabled-row');
    var count = el('input[type="checkbox"]:checked', this, 'all');
    hd_all.checked = count.length === el('input[type="checkbox"]', this, 'all').length ? true : false;
  }
});

hd_body.addEventListener('input', function(e) {
  if (e.target.tagName === 'TD' && e.target.isContentEditable && e.target.textContent.trim() !== '') {
    var pr = e.target.closest('tr');
    var cb = el('input[type="checkbox"]', pr);
    if (!pr.classList.contains('disabled-row') && !cb.checked) {
      cb.checked = true;
    }
  }
});

hd_body.addEventListener('click', function(e) {
  if (e.target.tagName === 'BUTTON') {
    var pr = e.target.closest('tr');
    pr.remove();
  }
});

we_curl.addEventListener('change', function() {
  if (this.checked) {
    we_bypass.checked = false;
    we_bypass.disabled = true;
  } else {
    we_bypass.disabled = false;
  }
});

el('.scrap-submit .submit').addEventListener('click', scrap_submit);
el('.result-xml textarea').addEventListener('dblclick', function() { this.select(); });
el('.result-xml .goto .to-top').addEventListener('click', function() { el('.result-xml textarea').scrollTop = 0; });
el('.result-xml .goto .to-bottom').addEventListener('click', function() { el('.result-xml textarea').scrollTop = el('.result-xml textarea').scrollHeight; });

document.addEventListener('keyup', function(e) {
  if (e.code == 'Enter' || e.keyCode == 13) el('.scrap-submit button').click();
});

document.querySelectorAll('[contenteditable]').forEach(function(item) {
  item.addEventListener('blur', () => {
    item.scrollLeft = 0;
  });
});
</script>
</body>
</html>
